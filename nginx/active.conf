# nginx/active.conf — Production (TLS via Let's Encrypt)

server {
    listen 80;
    server_name infinity-cloud.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2  on;
    server_name infinity-cloud.ru;

    ssl_certificate     /etc/letsencrypt/live/infinity-cloud.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infinity-cloud.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  185.31.114.0/24;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://infinity-cloud.ru https://app.infinity-cloud.ru wss://infinity-cloud.ru wss://app.infinity-cloud.ru; media-src 'self' blob: https:" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 500m;

    # Docker embedded DNS — re-resolve upstreams at runtime so
    # container IP changes (rebuilds) don't require an nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Core REST API ─────────────────────────────────────────
    location /api/ {
        set                $upstream_core http://core:3001;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $upstream_core;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header         Pragma        "no-cache" always;
    }

    # ── Realtime Socket.IO ────────────────────────────────────
    location /socket.io/ {
        set                    $upstream_realtime http://realtime:3002;
        proxy_pass             $upstream_realtime$request_uri;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_buffering        off;
        add_header             Cache-Control "no-store" always;
    }

    # ── Media service ─────────────────────────────────────────
    location /media/ {
        set                $upstream_media http://media:3003;
        proxy_pass         $upstream_media$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Block sensitive files
    location ~ /\.git { return 403; }
    location ~ /\.env { return 403; }

    # ── Frontend SPA ──────────────────────────────────────────
    location / {
        set                $upstream_frontend http://frontend:5173;
        proxy_pass         $upstream_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "no-store" always;
    }
}

# CDN origin — принимаем запросы от CDN по HTTP без редиректа
server {
    listen 80;
    server_name app.infinity-cloud.ru mqx7q0951p.cdn.twcstorage.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker embedded DNS — re-resolve upstreams at runtime.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
