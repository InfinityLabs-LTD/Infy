name: infy

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - infy-net

services:
  # ── Infrastructure ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - infy-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - infy-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"   # MinIO console (dev access)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infy-net
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET_AVATARS};
        mc mb --ignore-existing local/$${MINIO_BUCKET_MEDIA};
        mc anonymous set download local/$${MINIO_BUCKET_AVATARS};
        exit 0;
      "
    networks:
      - infy-net

  # ── Docker Socket Proxy (безопасный доступ к Docker API) ────
  # Монтирует docker.sock ТОЛЬКО здесь. Бэкенд обращается по HTTP к этому сервису.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      # Разрешённые операции — только чтение контейнеров + restart
      CONTAINERS: 1
      INFO: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      NODES: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      # POST разрешён только для /containers/:id/restart через allowlist в proxy
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net   # изолированная сеть — только core имеет доступ
    restart: unless-stopped

  # ── Backend roles ────────────────────────────────────────────

  core:
    <<: *backend-base
    environment:
      SERVICE_ROLE: core
      PORT: 3001
      DOCKER_PROXY_URL: http://socket-proxy:2375
    networks:
      - infy-net
      - socket-proxy-net   # доступ к socket-proxy только у core
    ports:
      - "3001:3001"

  realtime:
    <<: *backend-base
    environment:
      SERVICE_ROLE: realtime
      PORT: 3002
    ports:
      - "3002:3002"

  media:
    <<: *backend-base
    environment:
      SERVICE_ROLE: media
      PORT: 3003
    ports:
      - "3003:3003"

  # ── Frontend ─────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: http://ws.localhost
    env_file: .env
    networks:
      - infy-net
    restart: unless-stopped

  # ── nginx ────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - core
      - realtime
      - media
      - frontend
    networks:
      - infy-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  certbot-www:
  certbot-certs:

networks:
  infy-net:
    driver: bridge
  socket-proxy-net:
    driver: bridge
    internal: true   # недоступна извне Docker-сети
