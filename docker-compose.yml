name: infy

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - infy-net

services:
  # ── Infrastructure ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - infy-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - infy-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - minio-data:/data
    ports:
      # H-4: консоль MinIO слушает только loopback хоста — наружу не торчит
      # (в проде доступ через SSH-туннель). Раньше "9001:9001" биндил на 0.0.0.0.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infy-net
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET_AVATARS};
        mc mb --ignore-existing local/$${MINIO_BUCKET_MEDIA};
        mc mb --ignore-existing local/$${MINIO_BUCKET_BACKUPS:-backups};
        mc anonymous set download local/$${MINIO_BUCKET_AVATARS};
        exit 0;
      "
    networks:
      - infy-net

  # ── Docker Socket Proxy (безопасный доступ к Docker API) ────
  # Монтирует docker.sock ТОЛЬКО здесь. Бэкенд обращается по HTTP к этому сервису.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      # ВНИМАНИЕ (C-1): tecnativa/docker-socket-proxy гранулярен на уровне
      # СЕКЦИЯ+МЕТОД, а НЕ отдельных путей. CONTAINERS=1 + POST=1 разрешает
      # ЛЮБОЙ POST /containers/... (restart, stop, kill, pause). Сузить до
      # одного /restart этим образом нельзя.
      #
      # Принятый риск: управление контейнерами выполняет ТОЛЬКО админ
      # (роуты под requireAdmin, id валидируется в lib/docker.ts, действия
      # пишутся в аудит-лог). Сеть socket-proxy-net — internal:true, в ней
      # только core. Доверенный админ может остановить контейнер — это
      # задокументировано как ожидаемая возможность, а не дыра.
      # Если потребуется жёсткое ограничение до /restart — заменить этот
      # proxy на микросервис-форвардер (см. отчёт безопасности, C-1).
      CONTAINERS: 1
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      NODES: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      EXEC: 0
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net   # изолированная сеть — только core имеет доступ
    restart: unless-stopped

  # ── Backend roles ────────────────────────────────────────────

  core:
    <<: *backend-base
    environment:
      SERVICE_ROLE: core
      PORT: 3001
      DOCKER_PROXY_URL: http://socket-proxy:2375
    networks:
      - infy-net
      - socket-proxy-net   # доступ к socket-proxy только у core
    ports:
      # H-4: только loopback хоста — наружу ходят исключительно через nginx.
      # Прямой доступ к :3001 позволял бы спуфить X-Forwarded-For в обход
      # rate-limit (TRUSTED_PROXY теперь сужен до infy-net).
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  realtime:
    <<: *backend-base
    environment:
      SERVICE_ROLE: realtime
      PORT: 3002
    ports:
      - "127.0.0.1:3002:3002"   # H-4: только loopback, наружу через nginx
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  media:
    <<: *backend-base
    environment:
      SERVICE_ROLE: media
      PORT: 3003
    ports:
      - "127.0.0.1:3003:3003"   # H-4: только loopback, наружу через nginx
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # C-5: ограничиваем память/CPU media-инстанса. Транскод буферизует временные
    # файлы на диск (не в RAM), но ffmpeg+потоки всё равно требуют потолка, чтобы
    # пачка параллельных загрузок не уронила хост по памяти.
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # Фоновый воркер: доставка напоминаний календаря (push + realtime).
  # REST-портов не слушает.
  scheduler:
    <<: *backend-base
    environment:
      SERVICE_ROLE: scheduler

  # ── coturn (TURN/STUN для звонков) ──────────────────────────
  # Использует host-сеть: TURN ретранслирует медиа на большом диапазоне
  # UDP-портов (49152–65535), который непрактично пробрасывать поштучно.
  # Секрет и realm подставляются из env. На проде открой в firewall:
  #   3478/udp, 3478/tcp, 5349/tcp и диапазон 49152–65535/udp.
  coturn:
    image: coturn/coturn:4.6-alpine
    network_mode: host
    env_file: .env
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Конфиг из файла + динамические параметры (секрет/realm/внешний IP) из env.
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET}
      --realm=${TURN_REALM:-infy.local}
      ${TURN_EXTERNAL_IP:+--external-ip=$TURN_EXTERNAL_IP}
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    env_file: .env
    networks:
      - infy-net
    restart: unless-stopped

  # ── nginx ────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      core:
        condition: service_healthy
      realtime:
        condition: service_healthy
      media:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - infy-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  infy-net:
    driver: bridge
    # H-4: фиксируем подсеть, чтобы TRUSTED_PROXY доверял ровно ей
    # (а не всему 172.0.0.0/8). nginx — единственный источник X-Forwarded-For.
    ipam:
      config:
        - subnet: 172.28.0.0/16
  socket-proxy-net:
    driver: bridge
    internal: true   # недоступна извне Docker-сети
