# nginx/dev.conf — Local development (no TLS)

# ── Frontend (Vite dev server) ──────────────────────────────
server {
    listen 80;
    server_name localhost app.localhost;

    # Real IP passthrough
    set_real_ip_from  172.0.0.0/8;
    real_ip_header    X-Real-IP;

    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Core REST API ────────────────────────────────────────────
server {
    listen 80;
    server_name api.localhost;

    set_real_ip_from  172.0.0.0/8;
    real_ip_header    X-Real-IP;

    # Security headers
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header X-XSS-Protection        "1; mode=block";

    # Gzip
    gzip on;
    gzip_types application/json;

    # Large enough for media uploads
    client_max_body_size 210m;

    location / {
        proxy_pass         http://core:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Realtime Socket.IO ───────────────────────────────────────
server {
    listen 80;
    server_name ws.localhost;

    set_real_ip_from  172.0.0.0/8;
    real_ip_header    X-Real-IP;

    location / {
        proxy_pass             http://realtime:3002;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }
}

# ── Media service ────────────────────────────────────────────
server {
    listen 80;
    server_name media.localhost;

    set_real_ip_from  172.0.0.0/8;
    real_ip_header    X-Real-IP;

    client_max_body_size 500m;

    location / {
        proxy_pass         http://media:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
