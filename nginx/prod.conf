# nginx/prod.conf — Production (TLS via Let's Encrypt)
# Replace DOMAIN with actual domain via sed in install.sh

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name app.DOMAIN api.DOMAIN ws.DOMAIN media.DOMAIN;

    # certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name app.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/app.DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Real-IP;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://media.DOMAIN; connect-src 'self' https://api.DOMAIN wss://ws.DOMAIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Core REST API ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name api.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/api.DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Real-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;

    gzip on;
    gzip_types application/json;

    client_max_body_size 210m;

    location / {
        proxy_pass         http://core:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Realtime Socket.IO ────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name ws.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/ws.DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Real-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass             http://realtime:3002;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_buffering        off;
    }
}

# ── Media service ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name media.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/media.DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Real-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;

    client_max_body_size 500m;

    location / {
        proxy_pass         http://media:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
