# nginx/prod.conf — Production (TLS via Let's Encrypt)
# Replace DOMAIN with actual domain via sed in install.sh
# Routing: /api/ → core:3001, /socket.io/ → realtime:3002, /media/ → media:3003, / → frontend

# Redirect HTTP → HTTPS + certbot challenge
server {
    listen 80;
    server_name DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2  on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Доверяем X-Forwarded-For только от CDN/частных сетей (M-9). Раньше здесь был
    # set_real_ip_from 0.0.0.0/0 — он доверял XFF от КОГО УГОДНО, что позволяло
    # подделать IP и обойти rate-limit при прямом доступе к origin. Перечисли
    # реальные подсети твоего CDN ниже; прямой доступ к origin закрой фаерволом.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    # set_real_ip_from <CDN_SUBNET>;   # ← добавь подсети CDN (напр. Cloudflare/Timeweb)
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Security headers (server-level).
    # ВНИМАНИЕ (H-11): nginx НЕ наследует add_header в location, где есть
    # свой add_header. Поэтому в location / и location ~* ^/assets/ (у них
    # свой Cache-Control) эти заголовки ПРОДУБЛИРОВАНЫ. При изменении набора
    # заголовков правь во ВСЕХ трёх местах.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://DOMAIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # H-5: согласовано с backend MAX_UPLOAD_BYTES (200 МБ) + запас на multipart-обвязку.
    # Раньше было 500m — nginx принимал в 2.5× больше, чем способен обработать backend.
    client_max_body_size 210m;

    # ── Core REST API (strip /api prefix) ────────────────────
    location /api/ {
        proxy_pass         http://core:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Realtime Socket.IO ────────────────────────────────────
    location /socket.io/ {
        proxy_pass             http://realtime:3002;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_buffering        off;
    }

    # ── Media service (keep /media prefix so Fastify routes match) ──
    location /media/ {
        proxy_pass         http://media:3003/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Frontend SPA ──────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Запрещаем CDN кешировать HTML — только статику кешировать можно
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        # H-11: security-заголовки продублированы — иначе они не доходят до
        # HTML-страницы SPA (именно той, что исполняет скрипты).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           DENY always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://DOMAIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # Явно разрешаем CDN идти на origin при любой ошибке
        proxy_intercept_errors off;
    }

    # Статические ассеты (JS/CSS/img) — кешируем на 1 год
    location ~* ^/assets/ {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # H-11: дублируем security-заголовки (свой add_header выше отменяет
        # наследование серверных). JS-бандл должен ехать с nosniff и CSP.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           DENY always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://DOMAIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }
}
