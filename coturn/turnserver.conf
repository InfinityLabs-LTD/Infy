# ── coturn (TURN/STUN сервер для Infy-звонков) ───────────────
# Схема аутентификации: use-auth-secret. Бэкенд генерирует временные
# credentials (HMAC-SHA1 от "<expiry>:<userId>" на общем секрете) —
# см. backend/src/lib/turn.ts. Статические пользователи не нужны.

# Слушаем стандартные TURN-порты
listening-port=3478
tls-listening-port=5349

# Диапазон UDP-портов для медиа-ретрансляции.
# ВАЖНО: эти порты должны быть открыты в firewall/security-group.
min-port=49152
max-port=65535

# Аутентификация по общему секрету (REST API TURN, RFC 5766 §10.2).
use-auth-secret
# static-auth-secret и realm подставляются из env через entrypoint (см. docker-compose).
# static-auth-secret=<TURN_SECRET>
# realm=<TURN_REALM>

# Внешний адрес (для корректных relay-кандидатов за NAT). Подставляется из env.
# external-ip=<TURN_EXTERNAL_IP>

# Безопасность: запрещаем ретрансляцию на приватные/loopback диапазоны,
# чтобы TURN нельзя было использовать как прокси во внутреннюю сеть.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Производительность / логирование
fingerprint
stale-nonce=600
no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
