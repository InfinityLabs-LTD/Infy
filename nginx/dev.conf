# nginx/dev.conf — Local development (no TLS)
# Routing: /api/ → core:3001, /socket.io/ → realtime:3002, /media/ → media:3003, / → frontend

server {
    listen 80;
    server_name localhost;

    set_real_ip_from  172.0.0.0/8;
    real_ip_header    X-Real-IP;

    client_max_body_size 210m;   # H-5: согласовано с backend MAX_UPLOAD_BYTES

    # ── Core REST API (strip /api prefix) ────────────────────
    location /api/ {
        proxy_pass         http://core:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options        DENY;
        add_header X-XSS-Protection       "1; mode=block";

        gzip on;
        gzip_types application/json;
    }

    # ── Realtime Socket.IO ────────────────────────────────────
    location /socket.io/ {
        proxy_pass             http://realtime:3002;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ── Media service (keep /media prefix so Fastify routes match) ──
    # Раньше было proxy_pass …:3003/; — срезал префикс /media и расходился с
    # prod.conf, из-за чего media-роуты в dev не совпадали.
    location /media/ {
        proxy_pass         http://media:3003/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Frontend (Vite dev server with HMR) ──────────────────
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
