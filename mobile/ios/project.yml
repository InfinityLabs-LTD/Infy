name: Infy
options:
  bundleIdPrefix: ru.infy
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ru
  xcodeVersion: "16.0"
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 125.6422.04
targets:
  Infy:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Infy
    resources:
      - path: Infy/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.infy.messenger
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Infy/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Infy/Resources/Infy.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: true
      configs:
        Debug:
          INFY_API_BASE_URL: http://127.0.0.1:3001
          INFY_REALTIME_URL: http://127.0.0.1:3002
          INFY_CERTIFICATE_PINS: ""
        Release:
          INFY_API_BASE_URL: https://api.infy.example
          INFY_REALTIME_URL: https://ws.infy.example
          INFY_CERTIFICATE_PINS: ""
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: WebRTC
        product: WebRTC
    scheme:
      testTargets: []

